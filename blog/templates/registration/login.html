{% extends 'blog/base.html' %}

{% block content %}
    <h2>Log In</h2>

    {% if form.errors %}
        <p>Your username or password was incorrect. Please try again.</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Log In</button>
    </form>
{% endblock %}
